[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# POST /api/submit-lead: Next.js route (webhook-only) via @netlify/plugin-nextjs.
# Soft-fail Sheets/email: POST /api/contact (shared tab + Form Type).
# Uncomment for function-only deploys without src/app/api/submit-lead/route.ts:
# # AHREFS_WWW_APEX_REDIRECT — flatten https://www → apex (reduces Ahrefs redirect-chain)
[[redirects]]
  from = "/*"
  to = "https://disputeaccounting.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.disputeaccounting.com"]}

[[redirects]]
#   from = "/api/submit-lead"
#   to = "/.netlify/functions/submit-lead"
#   status = 200
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
